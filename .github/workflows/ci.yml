# RarZap CI：三平台构建 + 测试 + 打包（开源免费版）。
# 纯手动触发（Actions 页点 Run workflow）：push/PR 不触发任何构建。
# 手动跑一次 = 单矩阵三作业（windows/macos/linux），每作业只编一次 release，
# 测试用 --release 复用同一份构建，打包后挂 artifact 供下载，不发布。
# 将来要发版时再加回 push/tags 触发；发 Release 仍只看 tag（见 github release 作业）。
# - macOS 签名/公证：secrets 配齐才走，否则跳过（缺任一即跳）。
# - Windows 签名：SignPath 获批前无签名（见命名文档）。
# 代理：runner 直连外网，无需额外配置。
# 供应链加固（审计意见 #6）：第三方 Action 全部钉到 commit SHA（注释保留版本），
# 防大版本标签被投毒/劫持后 CI 静默执行恶意代码。升级时同步改 SHA+注释。

name: ci

on:
  # 只手动点：Actions → ci → Run workflow。push/PR/tag 一律不自动跑。
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos
            os: macos-latest
            target: aarch64-apple-darwin
          - name: linux
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Rust 工具链
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable (2026-10-11)
        with:
          targets: ${{ matrix.target }}

      # cargo 依赖+产物缓存：重复跑只编增量。key 按 target 隔离三平台。
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y gcc g++ clang libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev \
            libssl-dev libzstd-dev libvulkan1

      # 全作业只编这一次：测试与打包全部复用它。
      - name: 构建
        run: cargo build --release --locked --target ${{ matrix.target }}

      # 图标熔断：build.rs 里 rc.exe 缺失只 warning，不断构建；真缺了 exe 就没图标
      # （窗口左上/任务栏全靠它，见 checklist 第 1 项），发包前必须拦下。
      # 注意：必须先 touch build.rs 强制重跑构建脚本，否则 cargo 直接缓存跳过、warning 不重现。
      # （增量重编，几秒，不重新全量构建。）
      - name: Windows 图标检查
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          (Get-Item build.rs).LastWriteTime = Get-Date
          cargo build --release --locked --target ${{ matrix.target }} 2>&1 | Tee-Object -FilePath build-icon-check.log | Out-String | Write-Output
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          if (Select-String -Path build-icon-check.log -Pattern "winres skipped") { throw "winres failed: exe ships without icon" }
          Remove-Item build-icon-check.log

      # release 复用测试：依赖已编好，只增量编测试目标，不另起 dev profile 全量编。
      - name: 测试
        run: cargo test --release --locked --target ${{ matrix.target }}

      - name: 版本号
        id: ver
        shell: bash
        run: echo "version=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      # ---- Windows: Inno Setup 安装包（无签名，SignPath 获批后再加）----
      - name: Windows 安装包
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion="${{ steps.ver.outputs.version }}" /DSrcDir="..\..\target\${{ matrix.target }}\release" packaging\windows\rarzap.iss
          Get-ChildItem target\innosetup\*.exe | Out-String

      # ---- macOS: .app + 可选签名公证 + .dmg（只出开源版）----
      - name: macOS .app
        if: runner.os == 'macOS'
        run: bash packaging/macos/make-app.sh "target/${{ matrix.target }}/release"

      - name: macOS 签名与公证（secrets 齐才走）
        if: runner.os == 'macOS'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_P12_B64: ${{ secrets.MACOS_P12_B64 }}
          MACOS_P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: |
          if [ -z "$MACOS_SIGN_IDENTITY" ] || [ -z "$MACOS_P12_B64" ] || [ -z "$MACOS_P12_PASSWORD" ] \
             || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER" ] || [ -z "$APPLE_API_KEY_B64" ]; then
            echo "signing secrets incomplete; skip sign+notarize"
            exit 0
          fi
          echo "$MACOS_P12_B64" | base64 -d > /tmp/cert.p12
          CERT=/tmp/rarzap-ci.keychain
          security create-keychain -p "ci" "$CERT"
          security set-keychain-settings -lut 21600 "$CERT"
          security unlock-keychain -p "ci" "$CERT"
          security import /tmp/cert.p12 -k "$CERT" -P "$MACOS_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "ci" "$CERT"
          # 关键：新建的钥匙串默认不在搜索列表里，不加这句 codesign 永远
          # 报 no identity found（即使 P12 和 identity 名都对）。
          security list-keychains -d user -s "$CERT" $(security list-keychains -d user | tr -d '"')
          echo "--- identities in temp keychain ---"
          security find-identity -v -p codesigning "$CERT" || true
          # 前置断言：identity 名必须能在钥匙串里找到，否则直接报错，
          # 免得 codesign 那句 no identity found 看不出是 secret 配错了。
          security find-identity -v -p codesigning "$CERT" | grep -qF "$MACOS_SIGN_IDENTITY" || {
            echo "MACOS_SIGN_IDENTITY not found in imported P12; check secrets (see log above)"
            exit 1
          }
          codesign --deep --force --options runtime --sign "$MACOS_SIGN_IDENTITY" target/macos-stage/RarZap.app
          echo "$APPLE_API_KEY_B64" | base64 -d > /tmp/apikey.p8
          xcrun notarytool submit target/macos-stage/RarZap.app --key /tmp/apikey.p8 \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple target/macos-stage/RarZap.app
          # 顺序关键：必须用已签名的 .app 重打 DMG（直接重跑 make-app.sh 会删掉签名），
          # 再把公证票钉到 DMG 上——Gatekeeper 验的是用户双击的这个 DMG。
          SKIP_APP=1 bash packaging/macos/make-app.sh "target/${{ matrix.target }}/release"
          xcrun stapler staple target/RarZap-*.dmg

      - name: macOS 清理临时证书（无论成败）
        if: always() && runner.os == 'macOS'
        run: |
          security delete-keychain /tmp/rarzap-ci.keychain 2>/dev/null || true
          rm -f /tmp/cert.p12 /tmp/apikey.p8 || true

      # ---- Linux: .deb ----
      - name: Linux .deb
        if: runner.os == 'Linux'
        run: bash packaging/linux/build-deb.sh "target/${{ matrix.target }}/release"

      - name: 上传产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rarzap-${{ matrix.target }}
          path: |
            target/innosetup/*.exe
            target/*.dmg
            target/*.deb
          if-no-files-found: warn

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # 对 Cargo.lock 做 RustSec 漏洞库比对；有已知漏洞时失败。
      # 同时覆盖 unrar-ng-sys 这类 C 库的 CVE（审计意见 #1 的监控面）。
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2 branch (v2.0.0)
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: github release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
